<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trieu's Docs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --text: #1f1e1c; --muted: #6b6862;
    --border: #e4e1da; --accent: #c4623a; --accent-soft: #f6e6dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1918; --surface: #242321; --text: #ecebe7; --muted: #9c988f;
      --border: #36342f; --accent: #e08a62; --accent-soft: #3a2a22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .top { display: flex; align-items: center; gap: 16px; padding: 14px 0 10px; flex-wrap: wrap; }
  .brand { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; margin-right: auto; }
  input[type=search] {
    flex: 0 1 280px; min-width: 0; padding: 8px 12px; font: inherit; font-size: 14px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-bottom: -1px; }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none; padding: 10px 14px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  nav a:hover { color: var(--text); }
  nav a[aria-current=page] { color: var(--accent); border-bottom-color: var(--accent); }
  nav .n { font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--bg); }
  nav a[aria-current=page] .n { background: var(--accent-soft); }

  main { padding: 28px 0 64px; }
  .project-head h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .project-head p { color: var(--muted); margin: 4px 0 20px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  a.card {
    display: block; padding: 14px 16px; text-decoration: none; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .t { font-weight: 600; }
  .card .d { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">📚 Trieu's Docs</div>
      <input type="search" id="q" placeholder="Tìm theo tên…" autocomplete="off">
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="project-head"><h1 id="ptitle"></h1><p id="pdesc"></p></div>
  <div id="list"></div>
</main>
<script>
  const ALL = "Tất cả";
  const PROJECTS = {
    "GCI Business": "App quản lý cho chủ salon: Business App, Owner App, thanh toán, báo cáo.",
    "GCI Reward": "App cho khách hàng: tìm salon, đặt lịch, tích điểm và đổi thưởng.",
    "FastboyPay": "Cổng thanh toán và các prototype checkout.",
    "Quy trình & team": "Quy trình làm việc, QC và KPI của team.",
    "Học tập & khác": "Tài liệu học tập và công cụ cá nhân."
  };
  let items = [];
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const projects = () => [...new Set([...Object.keys(PROJECTS).filter(p => items.some(a => a.group === p)), ...items.map(a => a.group)])];
  const current = () => projects().find(p => slug(p) === location.hash.slice(1)) || ALL;

  const cards = rows => `<div class="grid">` + rows.map(a =>
    `<a class="card" href="${esc(a.url)}" target="_blank" rel="noopener">
       <div class="t">${esc(a.title)}</div><div class="d">Cập nhật ${a.updated}</div></a>`).join("") + "</div>";

  function render() {
    const tab = current(), q = norm($("q").value.trim());
    const match = a => norm(a.title).includes(q);
    const byDate = (a, b) => b.updated.localeCompare(a.updated);

    $("tabs").innerHTML = [ALL, ...projects()].map(p => {
      const n = p === ALL ? items.length : items.filter(a => a.group === p).length;
      return `<a href="#${p === ALL ? "" : slug(p)}" ${p === tab ? 'aria-current="page"' : ""}>${esc(p)}<span class="n">${n}</span></a>`;
    }).join("");

    $("ptitle").textContent = tab === ALL ? "Tất cả dự án" : tab;
    $("pdesc").textContent = tab === ALL ? "Danh mục artifact trên Claude. Nội dung nằm trên claude.ai, chỉ mở được khi đã được share." : (PROJECTS[tab] || "");

    let html;
    if (tab === ALL) {
      html = projects().map(p => {
        const rows = items.filter(a => a.group === p && match(a)).sort(byDate);
        return rows.length ? `<h2>${esc(p)} · ${rows.length}</h2>` + cards(rows) : "";
      }).join("");
    } else {
      const rows = items.filter(a => a.group === tab && match(a)).sort(byDate);
      html = rows.length ? cards(rows) : "";
    }
    $("list").innerHTML = html || `<p class="empty">Không tìm thấy artifact nào.</p>`;
    document.title = (tab === ALL ? "" : tab + " · ") + "Trieu's Docs";
  }

  fetch("artifacts.json").then(r => r.json()).then(data => { items = data; render(); });
  $("q").addEventListener("input", render);
  addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
</script>
</body>
</html>
