<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Trieu's Docs</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070d; --text: #f3f2fa; --muted: #9a98b3;
    --glass: rgba(255,255,255,.05); --glass-hi: rgba(255,255,255,.09); --line: rgba(255,255,255,.10);
    --blob1: #7c3aed; --blob2: #ec4899; --blob3: #06b6d4;
    --grad: linear-gradient(120deg, #a78bfa, #f472b6 45%, #22d3ee);
    --shadow: 0 10px 40px -12px rgba(124,58,237,.45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f4ff; --text: #1a1830; --muted: #625f80;
      --glass: rgba(255,255,255,.55); --glass-hi: rgba(255,255,255,.85); --line: rgba(80,60,160,.12);
      --blob1: #c4b5fd; --blob2: #fbcfe8; --blob3: #a5f3fc;
      --grad: linear-gradient(120deg, #7c3aed, #db2777 45%, #0891b2);
      --shadow: 0 10px 40px -14px rgba(124,58,237,.35);
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 15px/1.55 "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-x: hidden;
  }
  /* aurora background */
  .aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .aurora span { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(90px); opacity: .45; animation: drift 24s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { background: var(--blob1); top: -20vmax; left: -15vmax; }
  .aurora span:nth-child(2) { background: var(--blob2); top: 10vmax; right: -20vmax; animation-delay: -8s; }
  .aurora span:nth-child(3) { background: var(--blob3); bottom: -25vmax; left: 20vmax; animation-delay: -16s; opacity: .3; }
  .aurora::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 28px 28px;
    mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
  }
  @keyframes drift { to { transform: translate(6vmax, 4vmax) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .aurora span { animation: none; } }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-bottom: 1px solid var(--line);
  }
  .top { display: flex; align-items: center; gap: 16px; padding: 16px 0 12px; flex-wrap: wrap; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; margin-right: auto; display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px;
    background: var(--grad); box-shadow: var(--shadow);
  }
  .brand .name { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .search { position: relative; flex: 0 1 300px; min-width: 0; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  input[type=search] {
    width: 100%; padding: 10px 14px 10px 36px; font: inherit; font-size: 14px; color: var(--text);
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px;
  }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 0 4px rgba(167,139,250,.2); }

  nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 14px; }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    flex: none; padding: 8px 14px; text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500;
    border-radius: 999px; border: 1px solid transparent; white-space: nowrap; transition: all .2s;
  }
  nav a:hover { color: var(--text); background: var(--glass); }
  nav a[aria-current=page] { color: #fff; background: var(--grad); box-shadow: var(--shadow); }
  nav .n { font-size: 12px; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--glass-hi); }
  nav a[aria-current=page] .n { background: rgba(255,255,255,.25); }

  main { padding: 40px 0 80px; }
  .project-head { margin-bottom: 8px; }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .project-head h1 {
    font-size: clamp(30px, 5vw, 46px); line-height: 1.1; margin: 6px 0 8px; letter-spacing: -0.03em; font-weight: 800;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .project-head p { color: var(--muted); margin: 0 0 12px; max-width: 620px; }
  h2 { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; margin: 36px 0 14px; }
  h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
  h2 .cnt { color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 14px; }
  .card {
    position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 16px; text-decoration: none; color: inherit;
    background: var(--glass); border: 1px solid var(--line); border-radius: 16px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
  }
  a.card:hover {
    transform: translateY(-3px); background: var(--glass-hi);
    border-color: color-mix(in srgb, var(--c) 60%, transparent);
    box-shadow: 0 14px 40px -16px var(--c);
  }
  .card .ic {
    flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px;
    background: color-mix(in srgb, var(--c) 22%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
  }
  .card .body { min-width: 0; padding-right: 12px; }
  .card .t { font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .card .d { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .card .go { position: absolute; top: 14px; right: 14px; color: var(--muted); opacity: 0; transition: opacity .2s, transform .2s; }
  a.card:hover .go { opacity: 1; transform: translate(2px, -2px); }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { color: var(--muted); font-size: 13px; padding-bottom: 32px; text-align: center; }

  /* edit mode */
  .btn {
    font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer;
    color: var(--text); background: var(--glass); border: 1px solid var(--line); transition: all .2s; white-space: nowrap;
  }
  .btn:hover { background: var(--glass-hi); }
  .btn.primary { color: #fff; background: var(--grad); border-color: transparent; box-shadow: var(--shadow); }
  .btn.danger { color: #fb7185; }
  .btn[aria-pressed=true] { color: #fff; background: var(--grad); border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: wait; }
  div.card { cursor: default; }
  .card .acts { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .card .acts button {
    width: 32px; height: 32px; border-radius: 10px; cursor: pointer; font-size: 14px;
    background: var(--glass-hi); border: 1px solid var(--line); color: var(--text);
  }
  .card .acts button:hover { border-color: var(--c); }
  div.card .body { padding-right: 72px; }
  .card.dirty { border-style: dashed; border-color: var(--c); }
  .add-card {
    display: grid; place-items: center; min-height: 76px; border-radius: 16px; cursor: pointer; font: inherit; font-weight: 600;
    color: var(--muted); background: transparent; border: 1.5px dashed var(--line);
  }
  .add-card:hover { color: var(--text); border-color: #a78bfa; }
  .savebar {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 20; width: min(560px, calc(100% - 32px));
    display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 18px; border-radius: 999px;
    background: color-mix(in srgb, var(--bg) 70%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  .savebar .msg { margin-right: auto; font-size: 14px; color: var(--muted); }
  .savebar[hidden] { display: none; }
  dialog {
    width: min(480px, calc(100% - 32px)); padding: 24px; border-radius: 20px; color: var(--text);
    background: color-mix(in srgb, var(--bg) 88%, transparent); border: 1px solid var(--line);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 30px 80px -20px rgba(0,0,0,.7);
  }
  dialog::backdrop { background: rgba(5,5,15,.55); backdrop-filter: blur(4px); }
  dialog h3 { margin: 0 0 16px; font-size: 20px; }
  dialog label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 6px; }
  dialog input {
    width: 100%; padding: 10px 12px; font: inherit; font-size: 14px; color: var(--text);
    background: var(--glass); border: 1px solid var(--line); border-radius: 10px;
  }
  dialog input:focus { outline: none; border-color: #a78bfa; box-shadow: 0 0 0 4px rgba(167,139,250,.2); }
  dialog .hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
  dialog .hint a { color: #a78bfa; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 30; padding: 10px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; color: #fff; background: var(--grad); box-shadow: var(--shadow);
  }
  .toast.err { background: #e11d48; }
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand"><span class="logo">📚</span><span class="name">Trieu's Docs</span></div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Tìm tài liệu…" autocomplete="off" aria-label="Tìm tài liệu">
      </label>
      <button class="btn" id="editToggle" aria-pressed="false">✏️ Sửa</button>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <div class="project-head"><div class="eyebrow" id="peyebrow"></div><h1 id="ptitle"></h1><p id="pdesc"></p></div>
  <div id="list"></div>
</main>
<footer>Nội dung nằm trên claude.ai · chỉ mở được khi đã được share</footer>

<div class="savebar" id="savebar" hidden>
  <span class="msg" id="saveMsg"></span>
  <button class="btn" id="discardBtn">Hủy</button>
  <button class="btn primary" id="saveBtn">Lưu lên web</button>
</div>

<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h3 id="itemDlgTitle">Sửa artifact</h3>
    <label for="fTitle">Tên</label>
    <input id="fTitle" required>
    <label for="fUrl">Link claude.ai</label>
    <input id="fUrl" type="url" required placeholder="https://claude.ai/artifact/...">
    <label for="fGroup">Dự án</label>
    <input id="fGroup" list="groupList" required placeholder="Chọn hoặc gõ tên dự án mới">
    <datalist id="groupList"></datalist>
    <label for="fDate">Ngày cập nhật</label>
    <input id="fDate" type="date" required>
    <div class="row">
      <button class="btn danger" type="button" id="delBtn" style="margin-right:auto">🗑 Xóa</button>
      <button class="btn" type="button" id="cancelBtn">Đóng</button>
      <button class="btn primary" type="submit">Xong</button>
    </div>
  </form>
</dialog>

<dialog id="tokenDlg">
  <form method="dialog" id="tokenForm">
    <h3>Nhập mật khẩu sửa</h3>
    <p class="hint">Chỉ cần nhập 1 lần, trình duyệt này sẽ nhớ.</p>
    <label for="fToken">Mật khẩu</label>
    <input id="fToken" type="password" required autocomplete="current-password">
    <div class="row">
      <button class="btn" type="button" id="tokenCancel">Hủy</button>
      <button class="btn primary" type="submit">Lưu</button>
    </div>
  </form>
</dialog>

<script>
  const ALL = "Tất cả";
  const PROJECTS = {
    "GCI Business": { icon: "💼", color: "#a78bfa", desc: "App quản lý cho chủ salon: Business App, Owner App, thanh toán, báo cáo." },
    "GCI Reward": { icon: "🎁", color: "#f472b6", desc: "App cho khách hàng: tìm salon, đặt lịch, tích điểm và đổi thưởng." },
    "FastboyPay": { icon: "💳", color: "#22d3ee", desc: "Cổng thanh toán và các prototype checkout." },
    "Quy trình & team": { icon: "🧭", color: "#fbbf24", desc: "Quy trình làm việc, QC và KPI của team." },
    "Học tập & khác": { icon: "📖", color: "#34d399", desc: "Tài liệu học tập và công cụ cá nhân." }
  };
  const FALLBACK = { icon: "📄", color: "#94a3b8", desc: "" };
  const TOKEN_KEY = "doc_edit_pw";
  const meta = p => PROJECTS[p] || FALLBACK;
  let items = [], saved = "[]", editing = false, editIdx = -1;
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase();
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const projects = () => [...new Set([...Object.keys(PROJECTS).filter(p => items.some(a => a.group === p)), ...items.map(a => a.group)])];
  const current = () => projects().find(p => slug(p) === location.hash.slice(1)) || ALL;
  const fmt = d => d.split("-").reverse().join("/");
  const today = () => new Date().toLocaleDateString("sv");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
  };
  const serialize = list => "[\n" + list.map(a => "  " + JSON.stringify({ title: a.title, url: a.url, updated: a.updated, group: a.group })).join(",\n") + "\n]\n";
  const dirtyCount = () => {
    const before = new Map(JSON.parse(saved).map(a => [a.url, JSON.stringify(a)]));
    const after = new Map(items.map(a => [a.url, JSON.stringify(a)]));
    let n = 0;
    for (const [u, v] of after) if (before.get(u) !== v) n++;
    for (const u of before.keys()) if (!after.has(u)) n++;
    return n;
  };
  const savedSet = () => new Set(JSON.parse(saved).map(a => JSON.stringify(a)));

  function toast(msg, err) {
    const t = document.createElement("div");
    t.className = "toast" + (err ? " err" : ""); t.textContent = msg;
    document.body.append(t); setTimeout(() => t.remove(), err ? 6000 : 3500);
  }

  const cards = rows => {
    const clean = editing ? savedSet() : null;
    return `<div class="grid">` + rows.map(a => {
      const m = meta(a.group), i = items.indexOf(a);
      const inner = `<span class="ic">${m.icon}</span>
         <span class="body"><div class="t">${esc(a.title)}</div><div class="d">Cập nhật ${fmt(a.updated)}</div></span>`;
      if (editing) {
        const dirty = !clean.has(JSON.stringify(a));
        return `<div class="card${dirty ? " dirty" : ""}" style="--c:${m.color}">${inner}
          <span class="acts"><button title="Mở" data-open="${i}">↗</button><button title="Sửa" data-edit="${i}">✏️</button></span></div>`;
      }
      return `<a class="card" style="--c:${m.color}" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}
         <svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`;
    }).join("") + (editing ? `<button class="add-card" data-add>＋ Thêm artifact</button>` : "") + "</div>";
  };

  function render() {
    const tab = current(), q = norm($("q").value.trim());
    const match = a => norm(a.title).includes(q);
    const byDate = (a, b) => b.updated.localeCompare(a.updated);

    $("tabs").innerHTML = [ALL, ...projects()].map(p => {
      const n = p === ALL ? items.length : items.filter(a => a.group === p).length;
      const icon = p === ALL ? "✨" : meta(p).icon;
      return `<a href="#${p === ALL ? "" : slug(p)}" ${p === tab ? 'aria-current="page"' : ""}>${icon} ${esc(p)}<span class="n">${n}</span></a>`;
    }).join("");

    $("peyebrow").textContent = tab === ALL ? `${projects().length} dự án · ${items.length} tài liệu` : "Dự án";
    $("ptitle").textContent = tab === ALL ? "Tất cả dự án" : tab;
    $("pdesc").textContent = tab === ALL ? "Danh mục tài liệu, prototype và demo được tạo cùng Claude." : meta(tab).desc;

    let html;
    if (tab === ALL) {
      html = projects().map(p => {
        const rows = items.filter(a => a.group === p && match(a)).sort(byDate);
        return rows.length ? `<h2 style="--c:${meta(p).color}"><span class="dot"></span>${esc(p)}<span class="cnt">${rows.length}</span></h2>` + cards(rows) : "";
      }).join("");
    } else {
      const rows = items.filter(a => a.group === tab && match(a)).sort(byDate);
      html = rows.length || editing ? cards(rows) : "";
    }
    $("list").innerHTML = html || (editing ? cards([]) : `<p class="empty">Không tìm thấy tài liệu nào.</p>`);
    document.title = (tab === ALL ? "" : tab + " · ") + "Trieu's Docs";

    $("editToggle").setAttribute("aria-pressed", editing);
    $("editToggle").textContent = editing ? "✓ Xong sửa" : "✏️ Sửa";
    const n = dirtyCount();
    $("savebar").hidden = !editing && !n;
    $("saveMsg").textContent = n ? `${n} thay đổi chưa lưu` : "Chưa có thay đổi";
    $("saveBtn").disabled = $("discardBtn").disabled = !n;
  }

  function openItem(i) {
    editIdx = i;
    const a = i >= 0 ? items[i] : { title: "", url: "", group: current() === ALL ? "" : current(), updated: today() };
    $("itemDlgTitle").textContent = i >= 0 ? "Sửa artifact" : "Thêm artifact";
    $("fTitle").value = a.title; $("fUrl").value = a.url; $("fGroup").value = a.group; $("fDate").value = a.updated;
    $("groupList").innerHTML = projects().map(p => `<option value="${esc(p)}">`).join("");
    $("delBtn").hidden = i < 0;
    $("itemDlg").showModal();
  }

  $("itemForm").addEventListener("submit", e => {
    const a = { title: $("fTitle").value.trim(), url: $("fUrl").value.trim(), updated: $("fDate").value, group: $("fGroup").value.trim() };
    const dup = items.findIndex(x => x.url === a.url);
    if (dup >= 0 && dup !== editIdx) { e.preventDefault(); toast("Link này đã có trong danh mục", true); return; }
    if (editIdx >= 0) items[editIdx] = a; else items.push(a);
    render();
  });
  $("cancelBtn").onclick = () => $("itemDlg").close();
  $("delBtn").onclick = () => {
    if (!confirm(`Xóa "${items[editIdx].title}" khỏi danh mục?`)) return;
    items.splice(editIdx, 1); $("itemDlg").close(); render();
  };

  $("list").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.open) open(items[+b.dataset.open].url, "_blank", "noopener");
    else if (b.dataset.edit) openItem(+b.dataset.edit);
    else if ("add" in b.dataset) openItem(-1);
  });
  $("editToggle").onclick = () => { editing = !editing; render(); };
  $("discardBtn").onclick = () => { if (confirm("Bỏ hết thay đổi chưa lưu?")) { items = JSON.parse(saved); render(); } };

  async function publish(password) {
    const res = await fetch("/api/artifacts", {
      method: "PUT",
      headers: { Authorization: `Bearer ${password}`, "Content-Type": "application/json" },
      body: serialize(items)
    });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) throw Object.assign(new Error("Sai mật khẩu"), { auth: true });
    if (!res.ok) throw new Error(body.error || `Lỗi máy chủ ${res.status}`);
  }

  async function save() {
    const token = store.get(TOKEN_KEY);
    if (!token) { $("fToken").value = ""; $("tokenDlg").showModal(); return; }
    $("saveBtn").disabled = true; $("saveBtn").textContent = "Đang lưu…";
    try {
      await publish(token);
      saved = serialize(items); editing = false;
      toast("Đã lưu ✓");
    } catch (err) {
      if (err.auth) store.set(TOKEN_KEY, null);
      toast(err.message, true);
    } finally {
      $("saveBtn").textContent = "Lưu lên web"; render();
    }
  }
  $("saveBtn").onclick = save;
  $("tokenForm").addEventListener("submit", () => { store.set(TOKEN_KEY, $("fToken").value.trim()); save(); });
  $("tokenCancel").onclick = () => $("tokenDlg").close();

  addEventListener("beforeunload", e => { if (dirtyCount()) e.preventDefault(); });

  fetch("/api/artifacts", { cache: "no-store" }).then(r => r.json()).then(data => { items = data; saved = serialize(items); render(); });
  $("q").addEventListener("input", render);
  addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
</script>
</body>
</html>
